}

.timeline .when { font-size: 30px; font-weight: 700; color: var(--accent); }
.timeline .what { margin-top: 8px; font-size: 46px; font-weight: 700; }
.timeline .desc { margin-top: 12px; font-size: 32px; color: var(--muted); line-height: 1.5; }

/* ---------------------------------------------------------------------
 * ボタン (インタラクティブなデモ用)
 * ------------------------------------------------------------------- */
.btn {
  display: inline-flex;
  align-items: center;
  gap: 12px;
  padding: 16px 36px;
  border: 0;
  border-radius: 12px;
  font: 700 32px/1 var(--font-sans);
  color: var(--on-accent);
  background: var(--accent);
  cursor: pointer;
  transition: transform .15s, filter .15s;
}
.btn:hover { filter: brightness(1.1); }
.btn:active { transform: scale(.97); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.is-ghost { color: var(--accent); background: none; box-shadow: inset 0 0 0 3px var(--accent); }

/* ---------------------------------------------------------------------
 * 画像
 * ------------------------------------------------------------------- */
.img-fit { display: block; max-width: 100%; max-height: 100%; object-fit: contain; }
.img-cover { display: block; width: 100%; height: 100%; object-fit: cover; }
.frame { border-radius: var(--radius); box-shadow: 0 20px 60px rgba(0, 0, 0, .18); overflow: hidden; }

/* ---------------------------------------------------------------------
 * ブランド枠 (名前・ロゴ) — engine.js が data-brand に応じて生成する
 *   通常スライド: 上 / 下の帯、表紙・結び (.no-chrome): 小さなロゴ、セクション扉: なし
 *   テーマごとの調整は .deck-brand-* を上書きする
 * ------------------------------------------------------------------- */
.deck-brand-holder {
  position: absolute;
  inset: 0;
  z-index: 9;
  pointer-events: none;
}
.deck-brand {
  position: absolute;
  left: 0;
  right: 0;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 24px;
  height: 72px;
  padding: 0 var(--pad-x, 120px);
  font: 600 22px/1 var(--font-sans);
  color: var(--muted);
  transition: opacity .3s;
}
.deck-brand-header { top: 0; border-bottom: 1px solid var(--border); }
.deck-brand-footer { bottom: 0; border-top: 1px solid var(--border); padding-right: 220px; }
.deck-brand-id { display: flex; align-items: center; gap: 14px; }
.deck-brand-logo { display: block; height: 36px; width: auto; }
.deck-brand-label {
  padding: 4px 14px;
  border: 2px solid var(--danger);
  border-radius: 4px;
  font-size: 18px;
  letter-spacing: .08em;
  color: var(--danger);
}
.deck-brand-cover {
  top: 48px;
  left: auto;
  right: 80px;
  height: auto;
  padding: 0;
  font-size: 26px;
  opacity: 0;
}
.deck-brand-cover .deck-brand-logo { height: 52px; }

.deck-brand-holder.is-cover .deck-brand-header,
.deck-brand-holder.is-cover .deck-brand-footer,
.deck-brand-holder.is-plain .deck-brand-header,
.deck-brand-holder.is-plain .deck-brand-footer { opacity: 0; }
.deck-brand-holder.is-cover .deck-brand-cover { opacity: 1; }

/* 帯がある場合は本文の上下に余白を足す */
.deck:is([data-brand="header"], [data-brand="both"]) .slide:not(.no-chrome):not(.layout-section) { padding-top: calc(var(--pad-y) + 40px); }
.deck:is([data-brand="footer"], [data-brand="both"]) .slide:not(.no-chrome):not(.layout-section) { padding-bottom: calc(var(--pad-y) + 24px); }

/* ---------------------------------------------------------------------
 * アニメーション
 *   class="anim-fade-up" などを付けると「スライド表示時」に再生。
 *   .step と組み合わせると「そのステップが表示された時」に再生。
 *   遅延: style="--delay:.3s" / 長さ: style="--dur:1s"
 *   HTML は常に「最終状態」で書く (印刷・一覧ではアニメなしで最終状態が見える)
 * ------------------------------------------------------------------- */
.anim-fade-up { --anim-name: deck-fade-up; }
.anim-fade-down { --anim-name: deck-fade-down; }
.anim-fade-left { --anim-name: deck-fade-left; }
.anim-fade-right { --anim-name: deck-fade-right; }
.anim-fade { --anim-name: deck-fade; }
.anim-zoom { --anim-name: deck-zoom; }
.anim-pop { --anim-name: deck-pop; --ease: cubic-bezier(.3, 1.6, .5, 1); }
.anim-blur { --anim-name: deck-blur; }
.anim-draw { --anim-name: deck-draw; --dur: 1.4s; --ease: ease-in-out; }
.anim-stagger { --anim-name: none; }
.anim-stagger > * { --anim-name: deck-fade-up; animation-delay: calc(var(--delay, 0s) + var(--i, 0) * var(--stagger, .12s)) !important; }

.slide.active [class*="anim-"]:not(.step):not(.step [class*="anim-"]),
.slide.active .step.visible[class*="anim-"],
.slide.active .step.visible [class*="anim-"],
.slide.active .anim-stagger:not(.step) > *,
.slide.active .step.visible.anim-stagger > * {
  animation-name: var(--anim-name, none);
  animation-duration: var(--dur, .7s);
  animation-timing-function: var(--ease, cubic-bezier(.2, .7, .2, 1));
  animation-delay: var(--delay, 0s);
  animation-fill-mode: both;
}

/* SVG の線を描く: <g class="anim-draw"> や <path class="anim-draw">。
   components.js が中の図形に pathLength="1" を自動で付け、stroke-dashoffset (継承される) をアニメーションする */
.anim-draw { stroke-dasharray: 1; }

@keyframes deck-fade { from { opacity: 0; } }
@keyframes deck-fade-up { from { opacity: 0; transform: translateY(40px); } }
@keyframes deck-fade-down { from { opacity: 0; transform: translateY(-40px); } }
@keyframes deck-fade-left { from { opacity: 0; transform: translateX(-60px); } }
@keyframes deck-fade-right { from { opacity: 0; transform: translateX(60px); } }
@keyframes deck-zoom { from { opacity: 0; transform: scale(.8); } }
@keyframes deck-pop { from { opacity: 0; transform: scale(.4); } }
@keyframes deck-blur { from { opacity: 0; filter: blur(16px); } }
@keyframes deck-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }

@media (prefers-reduced-motion: reduce) {
  .slide *, .slide *::before, .slide *::after { animation-duration: .01s !important; transition-duration: .01s !important; }
}

/* =====================================================================
 * 図の部品 (diagrams.js) の見た目
 * 色はテーマ変数だけを使う (テーマを変えると図も追従する)
 * ===================================================================== */

.dg, .dg-stack {
  position: relative;
  width: 100%;
  height: 680px;
}
.fill > .dg, .fill > .dg-stack { height: 100%; }
/* .fill 自体が段組みのとき、行の高さを .fill に収める (行が図の中身に合わせて伸び、下の余白にはみ出さないように) */
.fill:is(.cols-2, .cols-3, .cols-4, .cols-2-1, .cols-1-2):has(> .dg, > .dg-stack) { grid-auto-rows: minmax(0, 1fr); }
.dg > script, .dg-stack > script { display: none; }
.dg-step { display: none; }
.dg-svg {
  display: block;
  width: 100%;
  height: 100%;
  overflow: visible;
  font-family: var(--font-sans);
  user-select: none;
}
.dg-error {
  padding: 24px;
  border: 2px dashed var(--danger);
  border-radius: 12px;
  font-size: 26px;
  color: var(--danger);
}

/* ---- ノード ---------------------------------------------------------- */
.dg-node { cursor: default; transition: opacity .35s; }
.dg-node.has-detail, .dg-node.has-children, .er-table { cursor: pointer; }
.dg-shape {
  fill: var(--surface);
  stroke: var(--border);
  stroke-width: 3;
  transition: fill .3s, stroke .3s, stroke-width .3s;
}
.dg-shape-line { fill: none; stroke: var(--border); stroke-width: 3; }
.dg-node:hover > .dg-shape { stroke: var(--accent); }
.dg-node.is-accent > .dg-shape { fill: var(--accent); stroke: var(--accent); }
.dg-node.is-accent > .dg-label, .dg-node.is-accent > .dg-sub { fill: var(--on-accent); }
.dg-node.is-ext > .dg-shape { stroke-dasharray: 12 8; fill: var(--bg); }
.dg-node.is-user > .dg-shape { fill: var(--accent-soft); stroke: var(--accent); }
.dg-node.is-db > .dg-shape { fill: var(--surface-2); }
.dg-node.is-queue > .dg-shape { fill: var(--bg); stroke: var(--accent-2); stroke-width: 4; }
.dg-label {
  font-size: 30px;
  font-weight: 700;
  fill: var(--fg);
  text-anchor: middle;
  dominant-baseline: central;
}
.dg-sub, .dg-hint {
  font-size: 24px;
  fill: var(--muted);
  text-anchor: middle;
  dominant-baseline: central;
}
.dg-detail-mark { fill: var(--accent); opacity: .7; }

/* 入れ子の詳細図: 全体表示では隠し、ズームすると表示 */
.dg-children { opacity: .45; pointer-events: none; transition: opacity .45s .2s; }
.dg-node.is-open > .dg-children { opacity: 1; pointer-events: auto; }
.dg-node.has-children.is-open > .dg-hint { opacity: 0; }
.dg-node.has-children > .dg-shape { fill: var(--bg); stroke-width: 4; }
.dg-node.has-children.is-open > .dg-shape { stroke: var(--accent); }
.dg-hint { transition: opacity .3s; }

/* ---- 矢印 ------------------------------------------------------------ */
.dg-edge { transition: opacity .35s; }
.dg-edge-line { fill: none; stroke: var(--muted); stroke-width: 3; }
.dg-edge.is-dashed .dg-edge-line { stroke-dasharray: 10 8; }
.dg-edge-hi { stroke: var(--accent); stroke-width: 5; opacity: 0; transition: opacity .3s; }
.dg-arrow-n { fill: var(--muted); }
.dg-arrow-a { fill: var(--accent); }
.dg-arrow-open { fill: none; stroke: var(--muted); stroke-width: 1.6; }
.dg-edge-label {
  font-size: 24px;
  fill: var(--muted);
  text-anchor: middle;
  paint-order: stroke;
  stroke: var(--bg);
  stroke-width: 8px;
  stroke-linejoin: round;
}
.dg-dot { fill: var(--accent); opacity: 0; transition: opacity .3s; }
.dg-edge.is-flowing .dg-dot { opacity: 1; }
.dg-edge.is-flowing .dg-edge-hi, .dg-edge.is-focus .dg-edge-hi { opacity: 1; }

/* 強調 (ステップの focus・クリック): それ以外を薄くする */
/* 入れ子の詳細図の中のノードは対象外 (ズームしたときに薄くならないように) */
.dg.has-focus .dg-svg > .dg-nodes > .dg-node:not(.is-focus),
.dg.has-focus .dg-svg > .dg-edges > .dg-edge:not(.is-focus):not(.is-flowing) { opacity: .2; }
.dg-node.is-focus > .dg-shape { stroke: var(--accent); stroke-width: 5; }

/* ---- グループ ---------------------------------------------------------- */
.dg-group rect { fill: var(--accent-soft); stroke: var(--accent); stroke-width: 2; stroke-dasharray: 8 8; opacity: .8; }
.dg-group-label { font-size: 24px; font-weight: 700; fill: var(--accent); }

/* ---- 詳細パネル・説明バー ------------------------------------------------ */
.dg-panel {
  position: absolute;
  top: 16px;
  right: 16px;
  z-index: 5;
  width: min(38%, 620px);
  max-height: calc(100% - 32px);
  overflow: auto;
  padding: 24px 28px;
  border: 2px solid var(--accent);
  border-radius: var(--radius);
  font-size: 28px;
  line-height: 1.55;
  color: var(--fg);
  background: var(--bg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .18);
  animation: dg-panel-in .3s ease both;
}
.dg-panel[hidden] { display: none; }
.dg-panel-title { margin: 0 40px 12px 0; font-size: 32px; font-weight: 700; color: var(--accent); }
.dg-panel-body p { margin: 0 0 .5em; }
.dg-panel-body ul { margin: 0; padding-left: 1.2em; }
.dg-panel-close {
  position: absolute;
  top: 12px;
  right: 14px;
  width: 44px;
  height: 44px;
  border: 0;
  border-radius: 50%;
  font-size: 30px;
  line-height: 1;
  color: var(--muted);
  background: var(--surface);
  cursor: pointer;
}
.dg-panel-close:hover { color: var(--fg); }
@keyframes dg-panel-in { from { opacity: 0; transform: translateX(24px); } }
.dg-caption {
  position: absolute;
  left: 16px;
  bottom: 12px;
  z-index: 4;
  max-width: 70%;
  padding: 12px 22px;
  border-left: 8px solid var(--accent);
  border-radius: 8px;
  font-size: 28px;
  line-height: 1.5;
  color: var(--fg);
  background: var(--surface);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
}
.dg-caption[hidden] { display: none; }

/* ---- 階層マップ (多段の入れ子) -------------------------------------------- */
.dg-crumbs {
  position: absolute;
  top: 12px;
  left: 16px;
  z-index: 4;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;
  max-width: 70%;
  padding: 6px 10px;
  border-radius: 999px;
  font-size: 28px;
  background: var(--surface);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
}
.dg-crumbs[hidden] { display: none; }
.dg-crumb {
  padding: 4px 14px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  color: var(--accent);
  background: none;
  cursor: pointer;
}
.dg-crumb:hover { background: var(--accent-soft); }
.dg-crumb[aria-current] { font-weight: 700; color: var(--fg); cursor: default; }
.dg-crumb-sep { color: var(--muted); }
.dg-stackback { fill: var(--surface-2); stroke: var(--border); stroke-width: 3; }
/* 図がパンくず (上)・説明バー (下) の裏に隠れないよう、表示枠を縮める */
.dg.is-drill { display: flow-root; } /* svg の margin-top が親に抜けないように */
.dg.is-drill.is-inside .dg-svg { margin-top: 64px; height: calc(100% - 64px); }
.dg.is-drill.has-caption .dg-svg { height: calc(100% - 80px); }
.dg.is-drill.is-inside.has-caption .dg-svg { height: calc(100% - 144px); }
.dg.is-drill .dg-node.has-children { cursor: pointer; }
.dg.is-drill .dg-node.has-children.is-accent > .dg-shape { fill: var(--accent); }
.dg.is-drill .dg-node.is-accent > .dg-hint { fill: var(--on-accent); opacity: .85; }
.dg-node.is-boundary { cursor: pointer; }
.dg-node.is-boundary > .dg-shape { fill: var(--bg); stroke: var(--muted); stroke-width: 3; stroke-dasharray: 10 8; }
.dg-node.is-boundary > .dg-label { fill: var(--muted); }
.dg-node.is-boundary:hover > .dg-shape { stroke: var(--accent); }
.dg-edge-hit { fill: none; stroke: transparent; stroke-width: 36; pointer-events: stroke; cursor: pointer; }
.dg-edge-count circle { fill: var(--bg); stroke: var(--accent); stroke-width: 3; }
.dg-edge-count text { font-size: 22px; font-weight: 700; fill: var(--accent); text-anchor: middle; dominant-baseline: central; }
.dg-enter { animation: dg-fade .45s ease both; }
/* 階層マップの移動: 寄りながら今の図を薄くし、中の図は少し小さい所から、外の図は少し大きい所から現れる */
.dg.dg-leaving .dg-svg > g { opacity: .15; transition: opacity .5s ease .1s; }
.dg-enter-in, .dg-enter-out { transform-box: view-box; transform-origin: 50% 50%; }
.dg-enter-in { animation: dg-fade .45s ease both, dg-zoom-in .45s ease both; }
.dg-enter-out { animation: dg-fade .45s ease both, dg-zoom-out .45s ease both; }
@keyframes dg-zoom-in { from { transform: scale(.9); } }
@keyframes dg-zoom-out { from { transform: scale(1.06); } }

/* データの流れ: 今の区間を太く、右下に流れのボタン */
.dg-edge.is-current .dg-edge-hi { stroke-width: 8; }
.dg-edge.is-current .dg-dot { r: 12px; }
.dg-node.is-current > .dg-shape { stroke: var(--accent); stroke-width: 7; }
.dg-flowui {
  position: absolute;
  right: 16px;
  bottom: 12px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 8px;
}
.dg-flowbar {
  display: flex;
  gap: 6px;
  padding: 6px;
  border-radius: 999px;
  background: var(--surface);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
}
.dg-flowbtn {
  min-width: 52px;
  height: 52px;
  padding: 0 18px;
  border: 0;
  border-radius: 999px;
  font: inherit;
  font-size: 28px;
  color: var(--fg);
  background: var(--bg);
  cursor: pointer;
}
.dg-flowbtn:hover:not(:disabled) { color: var(--accent); }
.dg-flowbtn:disabled { opacity: .35; cursor: default; }
.dg-flowui:not(.is-on) .dg-flow-prev, .dg-flowui:not(.is-on) .dg-flow-next, .dg-flowui:not(.is-on) .dg-flow-stop { display: none; }
.dg-flowui.is-on .dg-flow-pick { font-weight: 700; color: var(--accent); }
.dg-flowmenu {
  display: flex;
  flex-direction: column;
  min-width: 280px;
  padding: 8px;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  background: var(--bg);
  box-shadow: 0 16px 40px rgba(0, 0, 0, .18);
}
.dg-flowmenu[hidden] { display: none; }
.dg-flowmenu-item {
  padding: 12px 18px;
  border: 0;
  border-radius: 10px;
  font: inherit;
  font-size: 28px;
  text-align: left;
  color: var(--fg);
  background: none;
  cursor: pointer;
}
.dg-flowmenu-item:hover { background: var(--surface); }
.dg-flowmenu-item.is-active { font-weight: 700; color: var(--accent); }
.deck-print-mode .dg-flowui, .deck-thumb-slide .dg-flowui, .deck-print-mode .dg-crumbs { display: none !important; }

/* ---- ER 図 ------------------------------------------------------------ */
.er-table { transition: opacity .35s; }
.er-table.is-hidden, .er-rel.is-hidden { visibility: hidden; opacity: 0; }
.er-head { fill: var(--accent); }
.er-title { font-size: 28px; font-weight: 700; fill: var(--on-accent); text-anchor: middle; }
.er-row-bg { fill: transparent; transition: fill .3s; }
.er-row.is-key .er-row-bg { fill: var(--emph-bg); }
.er-col { font-size: 24px; fill: var(--fg); }
.er-row.is-pk .er-col { font-weight: 700; }
.er-more { font-size: 22px; fill: var(--muted); text-anchor: middle; }
.er-type { font-size: 22px; fill: var(--muted); text-anchor: end; font-family: var(--font-mono); }
.er-key { font-size: 21px; font-weight: 700; fill: var(--accent-3); font-family: var(--font-mono); }
.er-row.is-pk .er-key { fill: var(--accent); }
.er-card { fill: none; stroke: var(--muted); stroke-width: 3; }
.er-rel.is-focus .er-card { stroke: var(--accent); }
.er-detail { width: 100%; border-collapse: collapse; font-size: 24px; }
.er-detail td { padding: 6px 4px; border-bottom: 1px solid var(--border); }
.er-detail td:last-child { color: var(--muted); font-family: var(--font-mono); font-size: 20px; text-align: right; }

/* ---- シーケンス図 -------------------------------------------------------- */
.seq-life { stroke: var(--border); stroke-width: 3; stroke-dasharray: 10 10; }
.seq-msg { transition: opacity .3s; }
.seq-msg.is-hidden { visibility: hidden; opacity: 0; }
.seq-line { fill: none; stroke: var(--muted); stroke-width: 3; }
.seq-msg.is-return .seq-line { stroke-dasharray: 10 8; }
.seq-label { font-size: 24px; fill: var(--fg); text-anchor: middle; paint-order: stroke; stroke: var(--bg); stroke-width: 8px; stroke-linejoin: round; }
.seq-label.is-self { text-anchor: start; }
.seq-msg.is-current .seq-line { stroke: var(--accent); stroke-width: 5; }
.seq-msg.is-current .seq-label { fill: var(--accent); font-weight: 700; }
.slide.active .seq-msg.is-new:not(.is-return) .seq-line { stroke-dasharray: 1; animation: dg-draw .6s ease-out both; }
.slide.active .seq-msg.is-new.is-return .seq-line { animation: dg-fade .5s both; }
.slide.active .seq-msg.is-new .seq-label { animation: dg-fade .4s .25s both; }
@keyframes dg-draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
@keyframes dg-fade { from { opacity: 0; } }

/* ---- チャート ------------------------------------------------------------ */
.chart-grid { stroke: var(--border); stroke-width: 2; }
.chart-tick { font-size: 28px; fill: var(--muted); }
.chart-tick.is-y { text-anchor: end; }
.chart-tick.is-x { text-anchor: middle; }
.chart-unit { font-size: 26px; fill: var(--muted); text-anchor: end; }
.chart-legend-item { cursor: pointer; font-size: 28px; fill: var(--fg); }
.chart-legend-item.is-off { opacity: .35; }
.chart-series .chart-bar rect { fill: var(--c); }
.chart-value { font-size: 27px; font-weight: 700; fill: var(--fg); text-anchor: middle; }
.chart-value.is-h { text-anchor: start; }
.chart-line { fill: none; stroke: var(--c); stroke-width: 6; stroke-linejoin: round; stroke-linecap: round; stroke-dasharray: 1; }
.chart-point circle { fill: var(--bg); stroke: var(--c); stroke-width: 5; }
.chart-slice path { fill: var(--c); stroke: var(--bg); stroke-width: 4; cursor: pointer; transition: transform .25s; transform-origin: center; transform-box: fill-box; }
.chart-slice path:hover { transform: scale(1.03); }
.chart-pie-label { font-size: 28px; fill: var(--fg); }
.chart-series.is-off, .chart-series .is-off { display: none; }
.is-pending { visibility: hidden; opacity: 0; }
.chart-tip {
  position: absolute;
  z-index: 6;
  padding: 8px 14px;
  border-radius: 8px;
  font-size: 22px;
  white-space: nowrap;
  color: #fff;
  background: rgba(17, 24, 39, .9);
  pointer-events: none;
}
.chart-tip[hidden] { display: none; }
/* 伸びる・描かれるアニメーション (表示時) */
.chart-bar rect { transform-box: fill-box; transition: opacity .3s; }
.chart-plot.is-v .chart-bar rect { transform-origin: 50% 100%; }
.chart-plot.is-h .chart-bar rect { transform-origin: 0 50%; }
.slide.active .chart-plot.is-v .chart-bar:not(.is-pending) rect { animation: dg-grow-y .8s cubic-bezier(.2, .7, .2, 1) calc(var(--i) * 60ms) both; }
.slide.active .chart-plot.is-h .chart-bar:not(.is-pending) rect { animation: dg-grow-x .8s cubic-bezier(.2, .7, .2, 1) calc(var(--i) * 60ms) both; }
.slide.active .chart-bar:not(.is-pending) .chart-value,
.slide.active .chart-point:not(.is-pending) { animation: dg-fade .4s calc(.5s + var(--i) * 60ms) both; }
.slide.active .chart-series:not(.is-pending) > .chart-line { animation: dg-draw 1.2s ease-in-out both; }
.slide.active .chart-slice:not(.is-pending) { animation: dg-pop .5s calc(var(--i) * 90ms) both; }
@keyframes dg-grow-y { from { transform: scaleY(0); } }
@keyframes dg-grow-x { from { transform: scaleX(0); } }
@keyframes dg-pop { from { opacity: 0; transform: scale(.85); } }
.chart-slice { transform-box: fill-box; transform-origin: center; }

/* ---- 3D 分解図 ---------------------------------------------------------- */
.dg-stack {
  --tilt: 52deg;
  --rot: -28deg;
  --gap-closed: 24px;
  --gap-open: 190px;
  display: flex;
  align-items: center;
  justify-content: center;
  perspective: 2400px;
  cursor: grab;
}
.stack3d-inner {
  position: relative;
  width: 860px;
  height: 170px;
  transform-style: preserve-3d;
  transform: rotateX(var(--tilt)) rotateZ(var(--rot));
}
.layer3d {
  position: absolute;
  inset: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0 40px;
  border: 3px solid var(--accent);
  border-radius: var(--radius);
  font-size: 40px;
  font-weight: 700;
  color: var(--fg);
  background: color-mix(in srgb, var(--bg) 82%, var(--accent) 18%);
  box-shadow: 0 30px 60px rgba(0, 0, 0, .18);
  transform: translateZ(calc(var(--z) * var(--gap-closed)));
  transition: transform .9s cubic-bezier(.2, .7, .2, 1), background-color .3s, opacity .3s;
  cursor: pointer;
}
.layer3d:nth-child(3n+2) { border-color: var(--accent-2); background: color-mix(in srgb, var(--bg) 82%, var(--accent-2) 18%); }
.layer3d:nth-child(3n+3) { border-color: var(--accent-3); background: color-mix(in srgb, var(--bg) 82%, var(--accent-3) 18%); }
.dg-stack.is-exploded .layer3d { transform: translateZ(calc(var(--z) * var(--gap-open))); }
.dg-stack.has-focus .layer3d:not(.is-selected) { opacity: .35; }
.dg-stack.is-exploded .layer3d.is-selected { transform: translateZ(calc(var(--z) * var(--gap-open) + 60px)); }
.dg-stack .dg-panel { cursor: default; }

/* ---- 印刷・一覧・編集中: 動きを止めて全体を見せる ---------------------------------- */
.deck-print-mode .dg-dot, .deck-thumb-slide .dg-dot { display: none; }
.deck-print-mode .dg-panel, .deck-print-mode .dg-caption, .deck-print-mode .chart-tip { display: none !important; }

/* ---- ビフォー・アフター (.compare) ------------------------------------------ */
.dg-compare {
  --pos: 50%;
  position: relative;
  height: 680px;
  overflow: hidden;
  border: 2px solid var(--border);
  border-radius: var(--radius);
  cursor: ew-resize;
  user-select: none;
  touch-action: none;
}
.fill > .dg-compare { height: 100%; }
.compare-item {
  position: absolute;
  inset: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-width: 0;
  overflow: hidden;
  padding: 64px 56px 40px;
  background: var(--surface);
}
.compare-item.is-after { background: var(--bg); clip-path: inset(0 0 0 var(--pos)); }
.compare-item > img { max-width: 100%; max-height: 100%; object-fit: contain; }
.compare-handle {
  position: absolute;
  top: 0;
  bottom: 0;
  left: clamp(0px, calc(var(--pos) - 2.5px), calc(100% - 5px)); /* 端でも枠の外に出ない */
  z-index: 3;
  width: 5px;
  background: var(--accent);
  pointer-events: none;
}
.compare-knob {
  position: absolute;
  top: 50%;
  left: clamp(34px, var(--pos), calc(100% - 34px));
  z-index: 3;
  pointer-events: none;
  display: grid;
  place-items: center;
  width: 64px;
  height: 64px;
  border-radius: 50%;
  font-size: 30px;
  color: var(--on-accent);
  background: var(--accent);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .25);
  transform: translate(-50%, -50%);
}
.compare-label {
  position: absolute;
  top: 14px;
  z-index: 4;
  padding: 4px 16px;
  border-radius: 999px;
  font-size: 26px;
  font-weight: 700;
  pointer-events: none;
}
.compare-label.is-before { left: 16px; color: var(--fg); background: var(--surface-2); }
.compare-label.is-after { right: 16px; color: var(--on-accent); background: var(--accent); }
/* 印刷・一覧: 左右に並べる */
.deck-print-mode .dg-compare, .deck-thumb-slide .dg-compare { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
.deck-print-mode .compare-item, .deck-thumb-slide .compare-item { position: relative; clip-path: none; padding: 64px 28px 28px; }
.deck-print-mode .compare-item > *, .deck-thumb-slide .compare-item > * { zoom: .8; } /* 半分の幅に収めるため縮小 */
.deck-print-mode .compare-item.is-after, .deck-thumb-slide .compare-item.is-after { border-left: 5px solid var(--accent); }
.deck-print-mode .compare-handle, .deck-thumb-slide .compare-handle,
.deck-print-mode .compare-knob, .deck-thumb-slide .compare-knob { display: none; }

/* ---- ターミナル再生 (.terminal) --------------------------------------------- */
.dg-terminal {
  display: flex;
  flex-direction: column;
  height: 640px;
  overflow: hidden;
  border-radius: var(--radius);
  background: var(--code-bg);
  box-shadow: 0 20px 50px rgba(0, 0, 0, .25);
}
.fill > .dg-terminal { height: 100%; }
.dg-terminal > script { display: none; }
.term-bar {
  display: flex;
  align-items: center;
  gap: 18px;
  padding: 14px 22px;
  background: color-mix(in srgb, var(--code-bg) 80%, #fff 20%);
}
.term-dots { display: flex; gap: 10px; }
.term-dots i { width: 16px; height: 16px; border-radius: 50%; background: #ff5f57; }
.term-dots i:nth-child(2) { background: #febc2e; }
.term-dots i:nth-child(3) { background: #28c840; }
.term-title { font: 26px var(--font-mono); color: var(--code-muted); }
.term-screen {
  flex: 1;
  min-height: 0;
  overflow: hidden;
  padding: 22px 30px;
  font: 28px/1.55 var(--font-mono);
  font-variant-ligatures: none;
  color: var(--code-fg);
  white-space: pre-wrap;
  word-break: break-all;
}
.term-prompt { color: var(--tok-s); }
.term-line.is-cmd .term-text { color: #fff; font-weight: 700; }
.term-line.is-out { color: var(--code-fg); opacity: .9; }
.term-line.is-ok { color: var(--tok-s); }
.term-line.is-err { color: #ff7b72; }
.term-line.is-warn { color: #e3b341; }
.term-line.is-dim { color: var(--code-muted); }
.term-cursor {
  display: inline-block;
  width: .6em;
  height: 1.1em;
  margin-left: 2px;
  vertical-align: -.2em;
  background: var(--code-fg);
  animation: deck-caret .9s steps(1) infinite;
}
.dg:has(> .dg-flowui) > .dg-caption { max-width: calc(100% - 480px); }

/* ---- 拡大縮小・ドラッグ移動・ミニマップ (階層マップ) ---------------------------------- */
.dg.has-panzoom .dg-svg { overflow: hidden; cursor: grab; touch-action: none; }
.dg.has-panzoom.is-panning .dg-svg { cursor: grabbing; }
.dg-zoomui {
  position: absolute;
  right: 16px;
  bottom: 96px;
  z-index: 4;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.dg-zoombtn {
  width: 56px;
  height: 56px;
  border: 0;
  border-radius: 14px;
  font: inherit;
  font-size: 30px;
  line-height: 1;
  color: var(--fg);
  background: var(--surface);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .08);
  cursor: pointer;
}
.dg-zoombtn:hover { color: var(--accent); }
.dg-minimap {
  position: absolute;
  left: 16px;
  bottom: 96px;
  z-index: 4;
  width: 300px;
  height: 180px;
  border: 2px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .12);
  cursor: pointer;
  overflow: hidden;
}
.dg-minimap[hidden] { display: none; }
.dg-minimap-svg { display: block; width: 100%; height: 100%; pointer-events: none; }
.dg-minimap-view { fill: var(--accent-soft); fill-opacity: .35; stroke: var(--accent); stroke-width: 2px; vector-effect: non-scaling-stroke; }
.dg-minimap-svg .dg-dot { display: none; }
.deck-print-mode .dg-zoomui, .deck-print-mode .dg-minimap, .deck-thumb-slide .dg-zoomui, .deck-thumb-slide .dg-minimap { display: none !important; }

/* ---- 状態遷移図 ---------------------------------------------------------- */
.dg-state-start { fill: var(--fg); }
.dg-state-final { fill: none; stroke: var(--border); stroke-width: 3; pointer-events: none; }
.dg-node.is-current > .dg-state-final { stroke: var(--accent); }
.dg-sim {
  position: absolute;
  right: 16px;
  bottom: 12px;
  z-index: 4;
  max-width: 62%;
  padding: 14px 18px;
  border-radius: var(--radius);
  font-size: 28px;
  color: var(--fg);
  background: var(--surface);
  box-shadow: 0 6px 18px rgba(0, 0, 0, .1);
}
.dg-sim-now { font-weight: 700; }
.dg-sim-events { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 8px; }
.dg-sim-btn {
  padding: 6px 16px;
  border: 2px solid var(--accent);
  border-radius: 999px;
  font: inherit;
  font-size: 28px;
  color: var(--accent);
  background: var(--bg);
  cursor: pointer;
}
.dg-sim-btn:hover { color: var(--on-accent); background: var(--accent); }
.dg-sim-btn.is-reset { border-color: var(--border); color: var(--muted); }
.dg-sim-end { color: var(--muted); }
.dg-sim-history { margin-top: 6px; font-size: 28px; color: var(--muted); }
.dg:has(> .dg-sim) > .dg-zoomui { bottom: 220px; }
.deck-print-mode .dg-sim, .deck-thumb-slide .dg-sim { display: none !important; }

/* =====================================================================
 * マップ文書 (mapdoc.js) の見た目
 * 図の部品はスライド (1920×1080 を縮小表示) 向けの大きさなので、ブラウザの画面向けに文字を小さくする
 * ===================================================================== */

body.jh-mapdoc {
  display: grid;
  grid-template-rows: auto 1fr;
  height: 100vh;
  margin: 0;
  overflow: hidden;
  font-family: var(--font-sans);
  font-size: 15px;
  line-height: 1.6;
  color: var(--fg);
  background: var(--bg);
}
.jh-mapdoc #jh-map-data, .jh-mapdoc #jh-brand { display: none; }

/* ---- 上の帯 ---------------------------------------------------------- */
.jh-map-head {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 10px 18px;
  border-bottom: 1px solid var(--border);
  background: var(--surface);
}
.jh-map-brand { display: flex; align-items: center; font-weight: 700; color: var(--muted); }
.jh-map-brand img { display: block; height: 28px; }
.jh-map-title { margin: 0; font-family: var(--font-heading); font-size: 19px; font-weight: 700; color: var(--fg); }
.jh-map-label { padding: 1px 8px; border: 1px solid var(--accent); border-radius: 999px; font-size: 12px; color: var(--accent); }
.jh-map-tools { display: flex; align-items: center; gap: 8px; margin-left: auto; }
.jh-map-btn, .jh-map-data, .jh-map-search input {
  height: 34px;
  padding: 0 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  font: inherit;
  font-size: 14px;
  color: var(--fg);
  background: var(--bg);
}
.jh-map-btn { cursor: pointer; white-space: nowrap; }
.jh-map-btn:hover { border-color: var(--accent); color: var(--accent); }
.jh-map-toc-toggle { display: none; }
.jh-map-search { position: relative; }
.jh-map-search input { width: 240px; }
.jh-map-search input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
.jh-map-results {
  position: absolute;
  top: 40px;
  right: 0;
  z-index: 20;
  width: 340px;
  max-height: 60vh;
  margin: 0;
  padding: 6px;
  overflow: auto;
  list-style: none;
  border: 1px solid var(--border);
  border-radius: 10px;
  background: var(--bg);
  box-shadow: 0 12px 32px rgba(0, 0, 0, .16);
}
.jh-map-results[hidden] { display: none; }
.jh-map-result {
  display: block;
  width: 100%;
  padding: 7px 10px;
  border: 0;
  border-radius: 6px;
  font: inherit;
  text-align: left;
  color: var(--fg);
  background: none;
  cursor: pointer;
}
.jh-map-result:hover { background: var(--surface); }
.jh-map-result-path { display: block; font-size: 12px; color: var(--muted); }
.jh-map-noresult { padding: 8px 10px; color: var(--muted); }

/* ---- 目次と図 ---------------------------------------------------------- */
.jh-map-main { display: grid; grid-template-columns: 260px 1fr; min-height: 0; }
.jh-map-toc { overflow: auto; padding: 12px 8px; border-right: 1px solid var(--border); background: var(--surface); }
.jh-map-toc ul { margin: 0; padding: 0; list-style: none; }
.jh-toc-item {
  display: block;
  width: 100%;
  padding: 5px 10px 5px calc(10px + var(--depth, 0) * 16px);
  border: 0;
  border-radius: 6px;
  font: inherit;
  font-size: 14px;
  text-align: left;
  color: var(--fg);
  background: none;
  cursor: pointer;
}
.jh-toc-item.has-kids { font-weight: 700; }
.jh-toc-item:hover { background: var(--accent-soft); }
.jh-toc-item.is-current { color: var(--accent); background: var(--accent-soft); }
.jh-toc-item.is-selected { color: var(--on-accent); background: var(--accent); }
.jh-map-stage { position: relative; min-width: 0; min-height: 0; }
.jh-map-stage > .dg { height: 100%; }

/* 図の部品の大きさを画面向けに */
.jh-mapdoc .dg-crumbs { top: 10px; left: 12px; padding: 3px 6px; font-size: 14px; }
.jh-mapdoc .dg-crumb { padding: 2px 10px; }
.jh-mapdoc .dg.is-drill.is-inside .dg-svg { margin-top: 44px; height: calc(100% - 44px); }
.jh-mapdoc .dg.is-drill.has-caption .dg-svg { height: calc(100% - 56px); }
.jh-mapdoc .dg.is-drill.is-inside.has-caption .dg-svg { height: calc(100% - 100px); }
.jh-mapdoc .dg-caption { left: 12px; bottom: 10px; padding: 7px 14px; border-left-width: 5px; font-size: 14px; }
.jh-mapdoc .dg-flowui { right: 12px; bottom: 10px; }
.jh-mapdoc .dg-flowbtn { min-width: 34px; height: 34px; padding: 0 12px; font-size: 14px; }
.jh-mapdoc .dg-flowmenu { min-width: 200px; }
.jh-mapdoc .dg-flowmenu-item { padding: 7px 12px; font-size: 14px; }
.jh-mapdoc .dg:has(> .dg-flowui) > .dg-caption { max-width: calc(100% - 320px); }
.jh-mapdoc .dg-panel {
  top: 0;
  right: 0;
  bottom: 0;
  box-sizing: border-box;
  width: min(380px, 45%);
  max-height: none;
  padding: 18px 20px;
  border-width: 0 0 0 1px;
  border-color: var(--border);
  border-radius: 0;
  font-size: 14px;
  box-shadow: -8px 0 24px rgba(0, 0, 0, .08);
}
.jh-mapdoc .dg-panel-title { font-size: 18px; }
.jh-mapdoc .dg-panel-close { top: 10px; right: 10px; width: 32px; height: 32px; font-size: 20px; }
.dg-links h4 { margin: 14px 0 4px; font-size: 13px; color: var(--muted); }
.dg-links ul { margin: 0; padding-left: 1.1em; }
.dg-links a { color: var(--accent); }

/* ---- 狭い画面: 目次は引き出し ---------------------------------------------- */
@media (max-width: 860px) {
  .jh-map-main { grid-template-columns: 1fr; }
  .jh-map-toc { position: fixed; top: 0; bottom: 0; left: 0; z-index: 30; width: 260px; transform: translateX(-100%); visibility: hidden; transition: transform .2s, visibility .2s; }
  body.jh-toc-open .jh-map-toc { transform: none; visibility: visible; box-shadow: 8px 0 24px rgba(0, 0, 0, .18); }
  .jh-map-toc-toggle { display: inline-block; }
  .jh-map-head { flex-wrap: wrap; gap: 8px 10px; padding: 8px 12px; }
  .jh-map-title { flex: 1; min-width: 0; font-size: 16px; }
  .jh-map-tools { width: 100%; margin-left: 0; }
  .jh-map-search { flex: 1; min-width: 0; }
  .jh-map-search input { width: 100%; box-sizing: border-box; }
  .jh-map-results { left: 0; width: auto; }
  .jh-map-data { max-width: 40%; }
  .jh-mapdoc .dg-panel { width: 100%; top: auto; height: 55%; border-width: 1px 0 0; }
}

/* ---- 印刷 (?print): 階層ごとに 1 ページ ------------------------------------ */
@page { size: A4 landscape; margin: 12mm; }
body.jh-map-printing { display: block; height: auto; overflow: visible; }
body.jh-map-printing .jh-map-main { display: none; }
.jh-map-print { padding: 0 18px; }
.jh-print-page { padding: 18px 0; break-after: page; }
.jh-print-page:last-child { break-after: auto; }
.jh-print-page h2 { margin: 0 0 8px; font-size: 18px; }
.jh-print-fig { height: 115mm; border: 1px solid var(--border); border-radius: 8px; }
.jh-print-fig .dg-svg { width: 100%; height: 100%; }
.jh-print-fig .dg-dot { display: none; }
.jh-print-table { width: 100%; margin-top: 10px; font-size: 12px; border-collapse: collapse; }
.jh-print-table > tr > th { width: 22%; font-size: 13px; color: var(--fg); text-align: left; vertical-align: top; }
.jh-print-table > tr > th, .jh-print-table > tr > td { padding: 5px 8px; border-bottom: 1px solid var(--border); }
.jh-print-table .table { font-size: 12px; }
.jh-print-table .table th, .jh-print-table .table td { padding: 2px 6px; border-bottom-width: 1px; }
.jh-print-table p { margin: 0 0 4px; }
.jh-print-more { display: block; font-size: 11px; font-weight: 400; color: var(--muted); }
@media print {
  .jh-map-head { border: 0; background: none; }
}
.jh-mapdoc .dg-panel .table { font-size: 13px; }
.jh-mapdoc .dg-panel .table th, .jh-mapdoc .dg-panel .table td { padding: 4px 6px; border-bottom-width: 1px; }
/* 詳細パネルを開いている間は、図をパネルの左側に収める */
.jh-mapdoc .dg:has(> .dg-panel:not([hidden])) > .dg-svg { width: calc(100% - min(380px, 45%)); }
@media (max-width: 860px) {
  .jh-mapdoc .dg:has(> .dg-panel:not([hidden])) > .dg-svg { width: 100%; height: 45%; }
}
.jh-mapdoc .er-detail { margin: 6px 0 4px; font-size: 14px; }
.jh-mapdoc .er-detail td { padding: 3px 4px; }
.jh-mapdoc .er-detail td:last-child { font-size: 12px; }
.dg-links code { font-size: 12px; }
.jh-print-cols { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.jh-mapdoc .dg-zoomui { right: 12px; bottom: 56px; gap: 4px; }
.jh-mapdoc .dg-zoombtn { width: 34px; height: 34px; border-radius: 8px; font-size: 18px; }
.jh-mapdoc .dg-minimap { left: 12px; bottom: 56px; width: 200px; height: 120px; border-width: 1px; }
.jh-mapdoc .dg:has(> .dg-panel:not([hidden])) > .dg-zoomui { right: calc(min(380px, 45%) + 12px); }
.jh-print-fig .dg-zoomui, .jh-print-fig .dg-minimap { display: none; }
.jh-mapdoc .dg-sim { right: 56px; bottom: 10px; padding: 8px 12px; font-size: 14px; }
.jh-mapdoc .dg-sim-btn { padding: 3px 10px; border-width: 1px; font-size: 14px; }
.jh-mapdoc .dg-sim-history { font-size: 12px; }

}
</style>

<style>
@layer theme-base {
/* @theme default
 * @label スタンダード
 * @description 白地に青のすっきりしたデザイン。迷ったらこれ。どんな発表にも合う
 * @tags 汎用, すっきり, 明るい
 */

/* =====================================================================
 * テーマ: default (全テーマの土台)
 * 色・フォント・基本タイポグラフィを定義する。他のテーマはこのファイルの後に重ねて読み込み、
 * :root の変数と、必要ならレイアウトの装飾を上書きする。
 *
 * 基本タイポグラフィは :where() で詳細度を 0 にしてあるので、部品 (components.css) の指定が常に優先される。
 * ===================================================================== */

:root {
  /* 色 */
  --bg: #ffffff;
  --fg: #1a1f2b;
  --muted: #6b7280;
  --surface: #f4f6fa;
  --surface-2: #e9edf5;
  --border: #d9dee8;
  --accent: #2563eb;
  --accent-2: #0ea5a4;
  --accent-3: #f59e0b;
  --danger: #dc2626;
  --success: #16a34a;
  --accent-soft: rgba(37, 99, 235, .10);
  --on-accent: #ffffff;
  --emph-bg: rgba(250, 204, 21, .32);

  /* コード */
  --code-bg: #0f1420;
  --code-fg: #e6e9ef;

<script>
/*!
 * マップ文書のビューア (依存なし)
 *   スライドなしで、階層マップ (.diagram) を画面いっぱいに表示し、全体から細部へたどって読む。
 *   - 左: 目次 (ノードの階層)。クリックでその階層へ
 *   - 上: 検索 (名前・説明・タグ)、データでの絞り込み、印刷
 *   - URL: #/<階層>/<選んだノード>。ブラウザの戻る・進むで階層を行き来でき、リンクで共有できる
 *   - ?print: 階層ごとに 1 ページ (図 + その階層の部品の説明) を並べた印刷用の表示
 *   - JhMap.audit() (= Deck.audit()): データの誤り・1 階層のノード数・文字の重なりを検査する
 *   - エディタの iframe の中: F5 を「発表」としてホストに渡し、再読み込みを止める (bindHost)
 * 読み込み順: mapdoc.js → diagrams.js → JhMap.start()
 */
(function () {
  'use strict';

  var PRINT = /[?&]print\b/.test(location.search);
  var tracked = [], auditors = [];
  var quiet = false; // 検査中は URL・目次を動かさない

  // diagrams.js はスライドのエンジン (window.Deck) の一部を使うので、マップ文書用に最小限を用意する
  if (!window.Deck) {
    window.Deck = {
      mode: PRINT ? 'print' : 'map',
      slides: [],
      track: function (p) {
        tracked.push(p);
        p.then(function () { tracked.splice(tracked.indexOf(p), 1); }, function () { tracked.splice(tracked.indexOf(p), 1); });
        return p;
      },
      addAuditor: function (fn) { auditors.push(fn); },
      /** 進行中の演出 (ズームなど) が終わるまで待つ */
      settled: function (timeout) {
        return Promise.race([
          (function wait() { return tracked.length ? Promise.all(tracked.slice()).then(wait) : Promise.resolve(); })(),
          new Promise(function (r) { setTimeout(r, timeout || 4000); }),
        ]);
      },
      audit: function () { return JhMap.audit(); },
    };
  }

  function h(tag, cls, parent, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }
  function plain(html) {
    var d = document.createElement('div');
    d.innerHTML = html || '';
    return d.textContent || '';
  }

  // ---- 画面の骨組み (diagrams.js が .diagram を描く前に作る) ----
  var dataEl = document.getElementById('jh-map-data');
  var brandEl = document.getElementById('jh-brand');
  var brand = {};
  try { brand = JSON.parse(brandEl ? brandEl.textContent : '{}'); } catch (e) { /* なし */ }

  var head = h('header', 'jh-map-head', null);
  var main = h('div', 'jh-map-main', null);
  var toc = h('nav', 'jh-map-toc', main);
  toc.setAttribute('aria-label', '目次');
  var stage = h('main', 'jh-map-stage', main);
  var container = h('div', 'diagram', stage);
  container.setAttribute('data-map', '');
  var script = document.createElement('script');
  script.type = 'application/json';
  script.textContent = dataEl ? dataEl.textContent : '{"nodes":[]}';
  container.appendChild(script);
  document.body.insertBefore(main, document.body.firstChild);
  document.body.insertBefore(head, main);

  var JhMap = window.JhMap = {
    start: start,
    audit: audit,
    get api() { return container.jhDiagram; },
  };

  function start() {
    var api = container.jhDiagram;
    if (!api) { document.documentElement.classList.add('map-ready'); return; }
    buildHead(api);
    buildToc(api);
    if (PRINT) buildPrint(api);
    else { bindUrl(api); bindHost(); }
    document.documentElement.classList.add('map-ready');
  }

  // ---- エディタ (ホスト) の iframe の中で動くとき ----
  //   スライドのエンジンと同じ約束 (docs/edit-protocol.md) のうち、表示に関わるものだけを話す。
  //   - ready に kind: 'map' を付けて、スライドのないマップ文書だと知らせる
  //   - F5 / Ctrl+R: ブラウザの再読み込みを止める (iframe の中で押すと、エディタ全体が読み込み直される)。
  //     F5 は「発表」としてホストに渡す
  //   - 発表中の Esc: 図が使わなければ (詳細パネル・階層が閉じきっていれば)、発表の終了をホストに頼む
  function bindHost() {
    if (!window.parent || window.parent === window) return;
    var presenting = false;
    function post(msg) {
      msg.jhdeck = 2;
      try { window.parent.postMessage(msg, '*'); } catch (e) { /* なし */ }
    }
    window.addEventListener('message', function (ev) {
      var d = ev.data;
      if (!d || !d.jhdeck || ev.source !== window.parent) return;
      if (d.type === 'present') presenting = !!d.on;
    });
    document.addEventListener('keydown', function (ev) {
      var k = ev.key, mod = ev.ctrlKey || ev.metaKey;
      if (k === 'F5' || (mod && (k === 'r' || k === 'R'))) {
        ev.preventDefault();
        if (k === 'F5') post({ type: 'present' });
        return;
      }
      // 図の Esc (diagrams.js) は先に捕捉フェーズで処理して止めるので、ここへ来るのは図が使わなかった Esc
      if (k === 'Escape' && presenting && !/^(INPUT|TEXTAREA|SELECT)$/.test(ev.target.tagName)) {
        ev.preventDefault();
        post({ type: 'present-exit' });
      }
    });
    post({ type: 'ready', kind: 'map', slides: 0, index: 0, step: 0 });
  }

  // ---- 上の帯: ブランド・題名・検索・データ・印刷 ----
  function buildHead(api) {
    var showBrand = document.body.getAttribute('data-brand') && document.body.getAttribute('data-brand') !== 'none';
    var tocBtn = h('button', 'jh-map-btn jh-map-toc-toggle', head, '☰');
    tocBtn.type = 'button';
    tocBtn.setAttribute('aria-label', '目次を開く');
    tocBtn.addEventListener('click', function () { document.body.classList.toggle('jh-toc-open'); });
    if (showBrand && (brand.logo || brand.name)) {
      var b = h('div', 'jh-map-brand', head);
      if (brand.logo) { var img = h('img', null, b); img.src = brand.logo; img.alt = brand.name || ''; }
      else h('span', null, b, brand.name);
    }
    h('h1', 'jh-map-title', head, document.title || api.title);
    if (showBrand && brand.label) h('span', 'jh-map-label', head, brand.label);
    if (PRINT) return;

    var tools = h('div', 'jh-map-tools', head);
    var searchBox = h('div', 'jh-map-search', tools);
    var input = h('input', null, searchBox);
    input.type = 'search';
    input.placeholder = '検索 (名前・説明)';
    input.setAttribute('aria-label', '検索');
    var results = h('ul', 'jh-map-results', searchBox);
    results.hidden = true;
    var index = api.nodes().map(function (n) {
      var cols = (n.columns || []).map(function (c) { return c.name + ' ' + (c.note || ''); }).join(' ');
      return { n: n, text: [n.label, n.sub, (n.tags || []).join(' '), plain(n.detail), cols].join(' ').toLowerCase() };
    });
    function search() {
      var q = input.value.trim().toLowerCase();
      results.textContent = '';
      if (!q) { results.hidden = true; return; }
      var hits = index.filter(function (it) { return q.split(/\s+/).every(function (w) { return it.text.indexOf(w) >= 0; }); }).slice(0, 20);
      if (!hits.length) h('li', 'jh-map-noresult', results, '見つかりません');
      hits.forEach(function (it) {
        var li = h('li', null, results);
        var a = h('button', 'jh-map-result', li);
        a.type = 'button';
        a.setAttribute('data-id', it.n.id);
        h('b', null, a, it.n.label);
        h('span', 'jh-map-result-path', a, api.path(it.n.parent).join(' › '));
        a.addEventListener('click', function () { go(it.n.id); });
      });
      results.hidden = false;
    }
    function go(id) {
      results.hidden = true;
      input.value = '';
      input.blur(); // Esc / Backspace を図の操作 (閉じる・上へ) に戻す
      document.body.classList.remove('jh-toc-open');
      api.reveal(id);
    }
    input.addEventListener('input', search);
    input.addEventListener('keydown', function (ev) {
      if (ev.key === 'Enter') { var first = results.querySelector('.jh-map-result'); if (first) go(first.getAttribute('data-id')); }
      if (ev.key === 'Escape') { input.value = ''; results.hidden = true; ev.stopPropagation(); }
    });
    document.addEventListener('click', function (ev) { if (!searchBox.contains(ev.target)) results.hidden = true; });

    var names = api.dataNames();
    if (names.length) {
      var sel = h('select', 'jh-map-data', tools);
      sel.setAttribute('aria-label', 'データで絞り込む');
      h('option', null, sel, 'データ: すべて').value = '';
      names.forEach(function (n) { h('option', null, sel, n).value = n; });
      sel.addEventListener('change', function () { api.showData(sel.value); });
    }
    var printBtn = h('button', 'jh-map-btn', tools, '印刷');
    printBtn.type = 'button';
    printBtn.addEventListener('click', function () { window.open(location.pathname + '?print&autoprint', '_blank'); });
  }

  // ---- 目次 ----
  function buildToc(api) {
    var ul = h('ul', null, toc);
    var items = {};
    function item(id, label, depth, hasKids) {
      var li = h('li', null, ul);
      var b = h('button', 'jh-toc-item' + (hasKids ? ' has-kids' : ''), li, label);
      b.type = 'button';
      b.style.setProperty('--depth', depth);
      b.setAttribute('data-id', id);
      b.addEventListener('click', function () { document.body.classList.remove('jh-toc-open'); api.reveal(id); });
      items[id] = b;
    }
    item('', api.title, 0, true);
    api.nodes().forEach(function (n) { item(n.id, n.label, n.depth + 1, n.hasKids); });
    function mark(level, sel) {
      Object.keys(items).forEach(function (id) {
        items[id].classList.toggle('is-current', id === level);
        items[id].classList.toggle('is-selected', id === sel);
      });
      var on = items[sel] || items[level];
      if (on && on.scrollIntoView && !PRINT) on.scrollIntoView({ block: 'nearest' });
    }
    container.addEventListener('dg:change', function (ev) { if (!quiet) mark(ev.detail.level, ev.detail.selected); });
    mark(api.level(), api.selected());
  }

  // ---- URL (#/<階層>/<選んだノード>) ----
  function bindUrl(api) {
    var lastLevel = api.level();
    function hashOf(level, sel) { return '#/' + encodeURIComponent(level) + (sel ? '/' + encodeURIComponent(sel) : ''); }
    function read() {
      var m = location.hash.match(/^#\/([^/]*)(?:\/(.+))?$/);
      return m ? { level: decodeURIComponent(m[1]), sel: m[2] ? decodeURIComponent(m[2]) : null } : null;
    }
    container.addEventListener('dg:change', function (ev) {
      if (quiet) return;
      var hs = hashOf(ev.detail.level, ev.detail.selected);
      if (hs === location.hash || (!location.hash && hs === '#/')) { lastLevel = ev.detail.level; return; }
      try {
        if (ev.detail.level !== lastLevel) history.pushState(null, '', hs); // 階層の移動は履歴に残す (戻るで戻れる)
        else history.replaceState(null, '', hs);
      } catch (e) { /* 埋め込み (srcdoc・<base> 付き) では URL を変えられない。表示はそのまま続ける */ }
      lastLevel = ev.detail.level;
    });
    function apply() {
      var r = read() || { level: '', sel: null }; // ハッシュがなければ全体
      if (r.sel) api.reveal(r.sel);
      else if (r.level !== api.level() || api.selected()) api.reveal(r.level);
    }
    window.addEventListener('popstate', apply);
    window.addEventListener('hashchange', apply);
    apply();
  }

  // ---- 印刷: 階層ごとに 1 ページ ----
  function buildPrint(api) {
    document.body.classList.add('jh-map-printing');
    var pages = h('div', 'jh-map-print', null);
    document.body.insertBefore(pages, main);
    var nodes = api.nodes();
    api.levels().forEach(function (p) {
      api.drawLevel(p);
      var page = h('section', 'jh-print-page', pages);
      h('h2', null, page, api.path(p).join(' › '));
      var fig = h('div', 'jh-print-fig dg is-drill', page); // 図の部品の見た目 (.dg.is-drill …) をそのまま使う
      var svg = api.svg.cloneNode(true);
      svg.removeAttribute('id');
      fig.appendChild(svg);
      var kids = nodes.filter(function (n) { return n.parent === p; });
      var rows = kids.filter(function (n) { return n.sub || n.detail || n.hasKids || (n.columns && n.columns.length); });
      if (rows.length) {
        var table = h('table', 'table jh-print-table', page);
        rows.forEach(function (n) {
          var tr = h('tr', null, table);
          var th = h('th', null, tr, n.label);
          if (n.hasKids) h('span', 'jh-print-more', th, '→ 次のページ以降');
          var td = h('td', null, tr);
          if (n.sub) h('div', 'muted', td, n.sub);
          if (n.detail) { var d = h('div', null, td); d.innerHTML = n.detail; }
          if (n.columns && n.columns.length) { // テーブル: 列の一覧
            h('div', 'jh-print-cols', td, n.columns.map(function (c) { return (c.pk ? 'PK ' : c.fk ? 'FK ' : '') + c.name + (c.type ? ' ' + c.type : ''); }).join(' / '));
          }
        });
      }
    });
    api.drawLevel('');
    if (/[?&]autoprint\b/.test(location.search)) setTimeout(function () { window.print(); }, 300);
  }

  // ---- 検査 ----
  /**
   * 問題ごとに { type, level, ... } を返す (空配列 = 検査した範囲では問題なし)
   *   data    : データの誤り (存在しない id への矢印、流れの途切れ、id の重複)
   *   density : 1 つの階層のノードが多すぎる (12 個を超える)
   *   overlap : 図の中の文字同士が重なっている (全階層を描いて調べる)
   */
  function audit() {
    var issues = [];
    auditors.forEach(function (fn) {
      (fn() || []).forEach(function (i) { issues.push({ type: i.type, message: i.message }); });
    });
    var api = container.jhDiagram;
    if (!api) return issues;
    var keepLevel = api.level(), keepSel = api.selected();
    quiet = true;
    try { checkLevels(api, issues); } finally { api.drawLevel(keepLevel); quiet = false; }
    if (keepSel) api.reveal(keepSel);
    return issues;
  }

  function checkLevels(api, issues) {
    api.levels().forEach(function (p) {
      var where = api.path(p).join(' › ');
      var count = api.levelNodeCount(p);
      if (count > 12) issues.push({ type: 'density', level: where, count: count, message: '1 つの階層のノードが ' + count + ' 個あります。12 個程度までにし、多ければ children で入れ子にする' });
      api.drawLevel(p);
      var texts = Array.prototype.slice.call(api.svg.querySelectorAll('.dg-nodes text, .dg-edge-label')).map(function (t) {
        return { t: t, r: t.getBoundingClientRect(), node: t.closest('.dg-node') };
      }).filter(function (x) { return x.r.width && x.r.height && x.t.textContent.trim(); });
      for (var i = 0; i < texts.length; i++) {
        for (var j = i + 1; j < texts.length; j++) {
          var A = texts[i], B = texts[j];
          if (A.node && A.node === B.node) continue;
          var w = Math.min(A.r.right, B.r.right) - Math.max(A.r.left, B.r.left);
          var hh = Math.min(A.r.bottom, B.r.bottom) - Math.max(A.r.top, B.r.top);
          if (w <= 0 || hh <= 0) continue;
          var ratio = (w * hh) / Math.min(A.r.width * A.r.height, B.r.width * B.r.height);
          if (ratio > 0.2) issues.push({ type: 'overlap', level: where, overlap: Math.round(ratio * 100) + '%', text: A.t.textContent.trim() + ' × ' + B.t.textContent.trim() });
        }
      }
    });
  }
})();

/*!
 * 図の部品 (依存なし)
 *   .diagram       関連図 / ズームマップ (ノードと矢印、データの流れ、クリックで詳細・ズーム、入れ子の詳細図)
 *   .er-diagram    ER 図 (テーブル・列・リレーションを自動配置、クリックで関連を強調)
 *   .seq-diagram   シーケンス図 (メッセージを 1 本ずつ再生)
 *   .chart         データチャート (棒・横棒・折れ線・円・ドーナツ)
 *   .stack3d       3D 分解図 (CSS 3D。レイヤーを立体的に分解して見せる)

 * 共通の仕組み:

(function () {

  function s(tag, attrs, parent) {

    if (attrs) Object.keys(attrs).forEach(function (k) { if (attrs[k] != null) e.setAttribute(k, attrs[k]); });
    if (parent) parent.appendChild(e);

  }
  function h(tag, cls, parent, html) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html != null) e.innerHTML = html;
    if (parent) parent.appendChild(e);
    return e;
