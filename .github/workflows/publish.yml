name: Publish

# GitHub でリリースを公開すると、npm と MCP Registry に公開する
#   npm は Trusted Publishing (トークン不要)。npmjs.com のパッケージ設定で、このリポジトリの publish.yml を登録済み
on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write   # npm の Trusted Publishing と MCP Registry の GitHub OIDC 認証に必要

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - name: Update npm (Trusted Publishing には npm 11.5.1 以降が必要)
        run: npm install -g npm@latest
      - name: Install CJK fonts
        run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: npm ci
      - name: Tag matches package version
        run: test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - run: npm test
      - name: Publish to npm
        # 再実行したときに公開済みの版で失敗しないよう、まだ無いときだけ公開する
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          if npm view "jh-presentation@${VERSION}" version >/dev/null 2>&1; then
            echo "jh-presentation@${VERSION} is already on npm"
          else
            npm publish --access public   # provenance は Trusted Publishing で自動的に付く
          fi
      - name: Wait for the version on npm
        # npm は公開直後しばらく審査中で、MCP Registry はその版がまだ無いと登録を断る
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          for i in $(seq 1 60); do
            if npm view "jh-presentation@${VERSION}" version >/dev/null 2>&1; then exit 0; fi
            sleep 20
          done
          echo "jh-presentation@${VERSION} did not appear on npm in 20 minutes" >&2
          exit 1
      - name: Publish to MCP Registry
        run: |
          curl -L "https://github.com/modelcontextprotocol/registry/releases/latest/download/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
          ./mcp-publisher login github-oidc
          ./mcp-publisher publish
